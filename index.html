<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League Table Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header> League Table Tracker
    <p> Here are the standings of Europe's Top Football Leagues. Sort and Filter the Teams according to different categories.</p>
    </header>

    <main>
        <!-- Here you will be able to choose the league of your Choice-->
         <div class="controls">
            <label> League 
                <select id ="league-select">
                    <option value="eng.1"> Premier League </option>
                    <option value="esp.1"> La Liga </option>
                    <option value="ger.1"> Bundesliga </option>
                    <option value="ita.1"> Serie A </option>
                    <option value="fra.1"> Ligue 1 </option>
                </select>
            </label>
         </div>
         <!-- Here, they will messages like loading and errors-->
          <p id="message" role="status"> </p>

          <!-- The results will appear here but will stay hidden until we get data-->
           <section id="results" hidden>
            <h2 id="league-title"></h2>
            <!-- Sorting and filtering some controls-->
             <div class="controls">
                <label> Search Team
                    <input id="search-team" type="text" placeholder="e.g: city">
                </label>

                <label> Sort BY
                    <select id="sort-select">
                        <option value="rank"> League position </option>
                        <option value="points"> Points </option>
                        <option value="wins"> Wins </option>
                        <option value="goals"> Goals Scored </option>
                        <option value="gd"> Goal Difference </option>
                        <option value="name"> Team Names(A-Z) </option>
                    </select>
                </label>

                <label> Min Points
                    <input id="min-poi nts" type="number" min="0" placeholder="e.g: 20">
                </label>
             </div>

             <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th> Position</th>
                            <th> Team </th>
                            <th> P </th>
                            <th> W </th>
                            <th> D </th>
                            <th> L </th>
                            <th> GF </th>
                            <th> GA </th>
                            <th> GD </th>
                            <th> Pts </th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
             </div>
            </section>
        </main>
        
</body>
</html>
